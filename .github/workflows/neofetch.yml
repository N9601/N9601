name: neofetch card

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/neofetch.py, scripts/chip.py, scripts/streak.py]

permissions:
  contents: write

concurrency:
  group: neofetch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render cards
        env:
          # Add a fine-grained PAT as ACCESS_TOKEN so private repos count; falls back to public only.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/neofetch.py
          python scripts/streak.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/neofetch-*.svg assets/streak.svg assets/stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Update neofetch stats"
            git pull --rebase -q -X theirs
            git push
          fi
