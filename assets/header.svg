  <text class="rise" style="animation-delay:.2s" x="4" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="3" fill="#0066ff">FULL-STACK ENGINEER  <tspan fill="#6b6b6b">/</tspan>  <tspan fill="#ff5500">LSM ENGINES</tspan>  <tspan fill="#6b6b6b">/</tspan>  <tspan fill="#ff1133">x86 KERNELS</tspan></text>
