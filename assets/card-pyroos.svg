<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="440" height="240">
<style>
  .bar { animation: bar 2.8s ease-in-out infinite; transform-origin:left; transform-box:fill-box; }
  @keyframes bar { 0% { transform:scaleX(.15); } 50% { transform:scaleX(1); } 100% { transform:scaleX(.15); } }
  .dot { animation: d 1.6s ease-in-out infinite; }
  @keyframes d { 50% { opacity:.2; } }
</style>
<defs>
  <pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse">
    <path d="M22 0H0V22" fill="none" stroke="#141414" stroke-width="1"/>
  </pattern>
  <radialGradient id="r" cx="1" cy="0" r="0.9">
    <stop offset="0" stop-color="#ff1133" stop-opacity=".22"/>
    <stop offset="1" stop-color="#080808" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="440" height="240" rx="12" fill="#080808"/>
<rect width="440" height="240" rx="12" fill="url(#g)"/>
<rect width="440" height="240" rx="12" fill="url(#r)"/>
<rect class="bar" x="0" y="0" width="440" height="3" fill="#ff1133"/>
<text x="28" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3" fill="#6b6b6b">02 / SYSTEMS · KERNEL</text>
<circle class="dot" cx="404" cy="36" r="4" fill="#ff1133"/>
<text x="392" y="40" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2" fill="#6b6b6b">BOOTING</text>
<text x="26" y="84" font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="600" letter-spacing="-1" fill="#f5f5f5">PyroOS<tspan fill="#ff1133">.</tspan></text>
<text x="28" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#b8b8b8">x86 hobby OS. Assembly bootloader flips real</text><text x="28" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#b8b8b8">mode to protected mode, sets up GDT and IDT,</text><text x="28" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#b8b8b8">then hands off to a C kernel with VGA output.</text>
<rect x="28" y="196" width="64" height="22" rx="3" fill="none" stroke="#ff1133" stroke-opacity=".55"/><text x="60" y="211" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f5f5f5">x86 ASM</text><rect x="100.4" y="196" width="21" height="22" rx="3" fill="none" stroke="#ff1133" stroke-opacity=".55"/><text x="111" y="211" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f5f5f5">C</text><rect x="129.6" y="196" width="43" height="22" rx="3" fill="none" stroke="#ff1133" stroke-opacity=".55"/><text x="151" y="211" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f5f5f5">QEMU</text>
<rect x="0.5" y="0.5" width="439" height="239" rx="12" fill="none" stroke="#232323"/>
</svg>
